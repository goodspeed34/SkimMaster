name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git ca-certificates pkg-config meson ninja-build python3 \
            cmake \
            libboost-all-dev libnng-dev libfftw3-dev libsqlite3-dev inja-dev \
            nlohmann-json3-dev libsndfile1-dev libpng-dev libzip-dev libssl-dev \
            libsoapysdr-dev portaudio19-dev
      - uses: actions/checkout@v4
      - name: Build, test and install
        run: |
          meson setup build --buildtype=release --force-fallback-for=csdr,morsedec --prefix=/opt/SkimMaster
          meson compile -C build
          meson test -C build --print-errorlogs --suite SkimMaster
          meson install -C build --no-rebuild
          python3 tests/plugin_sdk.py /opt/SkimMaster
          python3 tests/wav_receiver.py /opt/SkimMaster/bin/SkimMasterTools /opt/SkimMaster/bin/SkimMaster subprojects/ft8_lib/test/wav/191111_110130.wav

  format:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install clang-format
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-format git ca-certificates
      - uses: actions/checkout@v4
      - name: Check C++ formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.cpp' '*.h' '*.hpp' | xargs clang-format --dry-run -Werror

  sanitizers:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      # ThreadSanitizer needs ASLR disabled through personality(2), which
      # the default container seccomp profile blocks.
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['address,undefined', 'thread']
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git ca-certificates pkg-config meson ninja-build python3 \
            cmake \
            libboost-all-dev libnng-dev libfftw3-dev libsqlite3-dev inja-dev \
            nlohmann-json3-dev libsndfile1-dev libpng-dev libzip-dev libssl-dev \
            libsoapysdr-dev portaudio19-dev
      - uses: actions/checkout@v4
      - name: Build and test with ${{ matrix.sanitize }}
        # Worker processes report through log files so that a sanitizer error
        # in a supervised child fails the job even when the test recovers.
        run: |
          mkdir -p "$RUNNER_TEMP/san"
          export ASAN_OPTIONS="log_path=$RUNNER_TEMP/san/asan"
          export UBSAN_OPTIONS="print_stacktrace=1:log_path=$RUNNER_TEMP/san/ubsan"
          export TSAN_OPTIONS="second_deadlock_stack=1:log_path=$RUNNER_TEMP/san/tsan"
          meson setup build --force-fallback-for=csdr,morsedec \
            -Db_sanitize=${{ matrix.sanitize }} -Db_lundef=false
          meson compile -C build
          setarch "$(uname -m)" -R \
            meson test -C build --print-errorlogs --suite SkimMaster -t 6
          if ls "$RUNNER_TEMP"/san/* >/dev/null 2>&1; then
            cat "$RUNNER_TEMP"/san/*
            exit 1
          fi

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git
          pacboy: >-
            toolchain:p meson:p ninja:p pkgconf:p cmake:p boost:p nng:p fftw:p
            sqlite:p inja:p nlohmann-json:p libsndfile:p libpng:p libzip:p
            openssl:p soapysdr:p portaudio:p python:p
      - name: Configure
        run: |
          bash .github/scripts/run-checked.sh meson setup build --buildtype=release --force-fallback-for=csdr,morsedec --prefix="$(cygpath -m "$RUNNER_TEMP")/SkimMaster"
      - name: Build
        run: bash .github/scripts/run-checked.sh meson compile -C build
      - name: Test
        run: bash .github/scripts/run-checked.sh meson test -C build --print-errorlogs --suite SkimMaster
      - name: Install and test installed modules
        run: |
          bash .github/scripts/run-checked.sh meson install -C build --no-rebuild
          bash .github/scripts/run-checked.sh python tests/plugin_sdk.py "$(cygpath -m "$RUNNER_TEMP")/SkimMaster"
          installed="$(cygpath -u "$RUNNER_TEMP")/SkimMaster/bin"
          bash .github/scripts/run-checked.sh python tests/wav_receiver.py "$installed/SkimMasterTools.exe" "$installed/SkimMaster.exe" subprojects/ft8_lib/test/wav/191111_110130.wav
